<script>
    const autoInfo = localStorage.getItem('loginInfo');
    if (autoInfo) {
        const loginInfo = JSON.parse(autoInfo);
        if ($('#remember').length > 0) {
            $('#user_name').val(loginInfo.user_name || '');
            $('#user_pwd').val(loginInfo.user_pwd || '');
            $('#remember').prop('checked', true);
        }
    }

    function logoutConfirm() {
        showDialog(
            '退出登录',
            '您确定要退出登录吗？',
            '确认',
            '取消',
            true,
            true,
            function (isConfirm) {
                if (isConfirm) {
                    showAlert('退出成功!', 'fa-check-circle', 'success', function () {
                        location.href = "{:mac_url('user/logout')}";
                    });
                }
            }
        );
    }

    $(function () {
        function show_date_time() {
            var endTimeStr = "{$obj.user_end_time|date='Y-m-d',###}";
            var BirthDay = new Date(endTimeStr);
            var today = new Date();
            var timeold = BirthDay.getTime() - today.getTime();
            var msPerDay = 24 * 60 * 60 * 1000;
            var daysold = Math.floor(timeold / msPerDay);
            if (daysold < 0) {
                $("#day").html('0 天');
            } else {
                $("#day").html(daysold + ' 天');
            }
        }
        show_date_time();
        setInterval(show_date_time, 1000);
    });

    $(function () {
        //登录
        $('#loginForm').on('submit', function (e) {
            e.preventDefault();

            if ($('#user_name').val() === '') { alert('请输入用户！'); $("#user_name").focus(); return false; }
            if ($('#user_pwd').val() === '') { alert('请输入密码！'); $("#user_pwd").focus(); return false; }
            if ($('#verify').val() === '') { alert('请输入验证码！'); $("#verify").focus(); return false; }

            $.ajax({
                url: "{:mac_url('user/login')}",
                type: "post",
                dataType: "json",
                data: $('#loginForm').serialize(),
                beforeSend: function () {
                    $("#login").text("登录中...");
                },
                success: function (res) {
                    if (res.code === 1) {
                        if ($('#remember').is(':checked')) {
                            const loginInfo = {
                                user_name: $('#user_name').val(),
                                user_pwd: $('#user_pwd').val()
                            }
                            localStorage.setItem('loginInfo', JSON.stringify(loginInfo));
                        } else {
                            localStorage.removeItem('loginInfo');
                        }
                        showAlert('登录成功！', 'fa-check-circle', 'success', function () {
                            location.href = "{:mac_url('user/index')}";
                        });
                    } else if (res.code === 1001) {
                        showDialog('登录失败', '账号或密码为空', '', '', true, false, function () { refreshCode(); });
                    } else if (res.code === 1002) {
                        showDialog('登录失败', res.msg, '', '', true, false, function () { refreshCode(); });
                    } else if (res.code === 1003) {
                        showDialog('登录失败', '账号或密码错误', '', '', true, false, function () { refreshCode(); });
                    } else {
                        showDialog('登录失败', res.msg, '', '', true, false, function () { refreshCode(); });
                    }
                },
                error: function () {
                    showDialog('登录失败', '请联系网站管理员', '', '', true, false, function () { refreshCode(); });
                }
            });
        })
    })

    $(function () {
        // 注册
        $('#regForm').on('submit', function (e) {
            e.preventDefault();

            if ($('#signup_name').val() === '') { layer.msg('请输入用户！'); $("#signup_name").focus(); return false; }
            if ($('#signup_pwd').val() === '') { layer.msg('请输入密码！'); $("#signup_pwd").focus(); return false; }
            if ($('#signup_pwd2').val() === '') { layer.msg('请重复输入密码！'); $("#signup_pwd2").focus(); return false; }
            if ($('#verify').val() === '') { layer.msg('请输入验证码！'); $("#verify").focus(); return false; }

            $.ajax({
                url: "{:mac_url('user/reg')}",
                type: "post",
                dataType: "json",
                data: $('#regForm').serialize(),
                beforeSend: function () {
                    $("#reg").text("注册中...");
                },
                success: function (res) {
                    if (res.code === 1) {
                        showAlert('注册成功！', 'fa-check-circle', 'success', function () {
                            location.href = "{:mac_url('user/login')}";
                        });
                    } else if (res.code === 1002) {
                        showDialog('注册失败', '账号或密码为空', '', '', true, false, function () { refreshCode(); });
                    } else if (res.code === 1007 || res.code === 1010) {
                        showDialog('注册失败', '请联系网站管理员', '', '', true, false, function () { refreshCode(); });
                    } else {
                        showDialog('注册失败', res.msg, '', '', true, false, function () { refreshCode(); });
                    }
                },
                error: function () {
                    showDialog('登录失败', '请联系网站管理员', '', '', true, false, function () { refreshCode(); });
                }
            });
        });
    });
</script>
