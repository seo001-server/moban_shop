<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员注册 - {$maccms.site_name}</title>
    <meta name="keywords" content="{$maccms.site_keywords}" />
    <meta name="description" content="{$maccms.site_description}" />
    <link rel="shortcut icon" href="{$maccms.path_tpl}images/ico/favicon.ico" type="image/x-icon">
    {include file="public/include"}
    <link rel="stylesheet" href="{$maccms.path_tpl}css/action.css">
</head>

<body>
    {include file="user/head"}

    <div class="login-container">
        <div class="login-section">
            <div class="login-header">
                <h1 class="login-title">欢迎注册</h1>
                <p class="login-subtitle">请输入相关信息</p>
            </div>

            <form id="regForm">
                <div class="form-group">
                    <label for="user_name" class="form-label">账号</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signup_name" name="user_name" class="form-control" placeholder="输入您的账号"
                            autocomplete="off" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user_pwd" class="form-label">密码</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signup_pwd" name="user_pwd" class="form-control" placeholder="输入您的密码"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user_pwd" class="form-label">重复密码</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signup_pwd2" name="user_pwd2" class="form-control"
                            placeholder="输入再次密码" required>
                    </div>
                </div>

                {if condition="$GLOBALS['config']['user']['reg_verify'] eq 1"}
                <div class="form-group">
                    <label for="verify" class="form-label">验证码</label>
                    <div class="input-with-icon flex">
                        <i class="fas verify-icon"></i>
                        <input type="text" class="form-control" id="verify" name="verify" placeholder="请输入验证码"
                            autocomplete="off" required>
                        <img src="{:url('verify/index')}" onclick="this.src=this.src+'?'+Math.random()">
                    </div>
                </div>
                {/if}

                <button type="submit" class="btn btn-login">注册账户</button>

                <div class="register-link">
                    已有账户? <a href="{:url('user/login')}">立即登录</a>
                </div>
            </form>
        </div>
    </div>

    {include file="user/foot"}
</body>

</html>
