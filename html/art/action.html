<script>
    const isFreeFlag = "{$obj.art_remarks|mac_default='0'}";
    const down_content = `<p style="color: #111">当前资源来源于互联网收集整理,版权争议与本站无关。这里所提供的资源均只能用于参考学习用，不得将其用于商业或者非法用途，否则，一切后果请用户自负。</p>
    <br>
    <p style="color: #111">您必须在下载后的24个小时之内，从您的电脑或手机中彻底删除上述内容。如果您喜欢该程序和内容，请支持正版，购买注册，得到更好的正版服务。</p>
    <br>
    <p style="color: #111">如您发现当前资源侵犯了您的相关版权,请及时通过下方的联系我们与我们联系处理。</p>`;
    const buyBtn = document.getElementById('download_btn');
    const file_name = '{$obj.art_id}';
    const file_url = `{$maccms.path_tpl}file/${file_name}.zip`
    const btns = document.querySelectorAll('.add-btn');
    const qq = "{$maccms.site_qq}";
    const telegram = "{$maccms.site_email}";
    const contact_content = `<ul class="contact-list">
            
                            <li class="contact-item">
            <div class="contact-icon">
                <i class="fab fa-qq fa-2xl"></i>
            </div>
            <div class="contact-details">
                <div class="contact-value">${qq}</div>
            </div>
        </li>

        <li class="contact-item" style="justify-content: space-between">
            <div class="contact-icon">
                <i class="fas fa-brands fa-telegram fa-2xl"></i>
            </div>
            <div class="contact-details">
                <div class="contact-value" style="text-align: end"><a href="${telegram}" target="_blank" rel="noopener noreferrer" class="jump-button">添加</a></div>
            </div>
        </li>
            
            </ul>`;

    function downloadFile(url, fileName) {
        fetch(url).then(res => res.blob()).then(blob => {
            if (blob.type.includes('zip')) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.target = '_self';
                link.click();
            } else {
                showAlert('下载失败!请稍后重试或联系网站管理员!', 'fa-circle-xmark', 'error');
            }
        })
            .catch(() => {
                showAlert('下载失败!请稍后重试或联系网站管理员!', 'fa-circle-xmark', 'error');
            })
    }

    function showContactDialog() {
        showDialog('请添加以下方式', contact_content, '', '', true, false);
    }

    if (buyBtn) {
        if (Number(isFreeFlag) === 0) {
            buyBtn.addEventListener('click', function () {
                showDialog('下载提示', down_content, '我已知晓', '取消', true, true, function (isConfirm) {
                    if (isConfirm) {
                        downloadFile(file_url, file_name);
                    }
                });
            });
        } else {
            buyBtn.addEventListener('click', function () {
                showContactDialog();
            })
        }
    }

    btns.forEach(btn => {
        btn.addEventListener('click', showContactDialog);
    });


    // 监听跳转
    $('#mOrder').click('event', function (e) {
        e.preventDefault();
        const page = 1;
        const limit = 10;
        const userToken = UserIdentifier.getOrCreateUserToken();
        const isValidUser = UserIdentifier.isSameUser(userToken);
        const user_id = isValidUser ? userToken : null;

        const param = `page=${page}&limit=${limit}&user_id=${user_id}`;

        // 获取当前URL（不带hash）
        let url = $(this).attr('href');
        // 判断是否已有参数
        if (url.indexOf('?') > -1) {
            url += '&' + param;
        } else {
            url += '?' + param;
        }
        location.href = url;
    })



    function getCart() {

        const userToken = UserIdentifier.getOrCreateUserToken();
        const isValidUser = UserIdentifier.isSameUser(userToken);
        const user_id = isValidUser ? userToken : null;
        console.log(user_id);
        return JSON.parse(localStorage.getItem('cart') || '[]');
    }
    function setCart(cart) {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function addToCart(id, name, price, img) {
        var domain = location.protocol + '//' + location.host
        let art_img = domain + '/' + img;

        let cart = getCart();
        let exist = cart.find(item => item.id === id);
        if (!exist) {
            cart.push({ id, name, price, art_img, qty: 1 });
            setCart(cart);
            // 获取用户标识（不存在则创建）
            const userToken = UserIdentifier.getOrCreateUserToken();

            showAlert('已加入购物车', 'fa-check-circle', 'success');
        } else {
            showAlert('该模板已在购物车', 'fa-circle-exclamation', 'info');
        }
    }

    // 简易购物车本地存储实现
    function removeFromCart(id) {
        showDialog('提示', '是否将此模板从购物车中删除?', '', '', true, true, function (isConfirm) {
            if (isConfirm) {
                let cart = getCart();
                cart = cart.filter(item => item.id !== id);
                setCart(cart);
                renderCart();
                showAlert('删除成功!', 'fa-circle-check', 'success', function () {
                    location.reload();
                })
            }
        });

    }

    // 删除按钮显示
    function toggleDeleteSelectBtn() {
        if ($('.cart-checkbox:checked').length > 0) {
            $('.btn-delete.hidden').removeClass('hidden');
        } else {
            $('.btn-delete').first().addClass('hidden');
        }
    }

    function updateQty(id, qty) {
        let cart = getCart();
        cart = cart.map(item => {
            if (item.id === id) {
                item.qty = Math.max(1, Number(qty) || 1);
            }
            return item;
        });
        setCart(cart);
        renderCart();
    }

    // 数量加减
    function changeQty(id, delta) {
        let cart = getCart();
        cart = cart.map(item => {
            if (item.id === id) {
                item.qty = Math.max(1, (item.qty || 1) + delta);
            }
            return item;
        });
        setCart(cart);
        renderCart();
    }

    // 数量输入
    function changeQtyInput(id, val) {
        updateQty(id, val);
    };

    // 全选功能
    $(document).on('change', '#select-all', function () {
        $('.cart-checkbox').prop('checked', this.checked);
        toggleDeleteSelectBtn();
    });
    // 单个checkbox变化时，控制全选状态和按钮显示
    $(document).on('change', '.cart-checkbox', function () {
        const all = $('.cart-checkbox').length;
        const checked = $('.cart-checkbox:checked').length;
        $('#select-all').prop('checked', all === checked);
        toggleDeleteSelectBtn();
    });

    // 删除选中
    function removeSelect() {
        const ids = $('.cart-checkbox:checked').map(function () { return $(this).val(); }).get();
        if (ids.length === 0) return;
        showDialog('提示', '确定删除选中的模板吗？', '确认', '取消', true, true, function (isConfirm) {
            if (isConfirm) {
                let cart = getCart();
                cart = cart.filter(item => !ids.includes(item.id));
                setCart(cart);
                renderCart();
                showAlert('删除成功!', 'fa-circle-check', 'success');
            }
        });
    };
    // 删除全部
    function removeAll() {
        showDialog('提示', '确定清空购物车吗？', '确认', '取消', true, true, function (isConfirm) {
            if (isConfirm) {
                setCart([]);
                renderCart();
                showAlert('购物车已清空!', 'fa-circle-check', 'success');
            }
        });
    };

    // 结算按钮
    $('#checkout-btn').on('click', function () {
        const cart = getCart();

        // 获取所有选中的checkbox的id
        const checkedIds = $('.cart-checkbox:checked').map(function () { return $(this).val(); }).get();
        if (checkedIds.length === 0) {
            showAlert('请先选择要结算的模板', 'fa-circle-xmark', 'info');
            return;
        }

        // 只结算选中的商品
        const selectedItems = cart.filter(item => checkedIds.includes(item.id));
        const price = $('#cart-total').text();

        const userToken = UserIdentifier.getOrCreateUserToken();
        const isValidUser = UserIdentifier.isSameUser(userToken);
        const user_id = isValidUser ? userToken : null;

        showDialog('结算提示', '确认购买这些模板吗？', '确认', '取消', true, true, function (isConfirm) {
            if (isConfirm) {
                $.ajax({
                    url: "{:url('MOrder/buy')}",
                    type: "post",
                    dataType: "json",
                    data: { price: price, mbs_info: checkedIds, user_id: user_id },
                    beforeSend: showLoading('正在生成订单,请稍候...'),
                    success: function (res) {
                        closeLoading();
                        if (res.code == 1) {
                            // 只移除已结算的商品
                            const newCart = cart.filter(item => !checkedIds.includes(item.id));
                            setCart(newCart);
                            renderCart();
                            // showAlert('购买成功！', 'fa-circle-check', 'success');
                            location.href = "{:mac_url('user/mb_orders')}";
                        } else {
                            showDialog('系统正在查询中', res.msg, '', '', true, false);
                        }
                    }
                })

            }
        });
    });

</script>
