<div class="pagination">
    {if condition="$__PAGING__.record_total gt 0"}
    <a href="{$__PAGING__.page_url|mac_url_page=$__PAGING__.page_prev}"
        class="page-link {if $__PAGING__.page_current == 1}ellipsis{/if}">
        <i class="fas fa-chevron-left"></i>
    </a>

    {maccms:foreach name="$__PAGING__.page_num" id="num"}
    {if $__PAGING__['page_current'] == $num}
    <span class="page-link active">{$num}</span>
    {else}
    <a href="{$__PAGING__.page_url|mac_url_page=$num}" class="page-link">{$num}</a>
    {/if}
    {/maccms:foreach}


    <a href="{$__PAGING__.page_url|mac_url_page=$__PAGING__.page_next}"
        class="page-link {if $__PAGING__.page_current == $__PAGING__.page_next}ellipsis{/if}">
        <i class="fas fa-chevron-right"></i>
    </a>
    {else}
    暂无数据
    {/if}
</div>
